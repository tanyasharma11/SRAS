<!-- Session verification in progress: thin progress bar + blank header -->
@if (isVerifying()) {
  <header class="pub-header">
    <span class="nav-brand">SRAS</span>
    <span class="nav-spacer"></span>
  </header>
  <mat-progress-bar mode="indeterminate" class="verify-bar"></mat-progress-bar>
}

<!-- Authenticated app nav -->
@if (!isVerifying() && isLoggedIn()) {
  <nav class="app-nav">
    <a routerLink="/" class="nav-brand">SRAS</a>
    <span class="nav-spacer"></span>

    @if (!isManager()) {
      <a mat-button routerLink="/employees" routerLinkActive="nav-active">
        <mat-icon>person</mat-icon> My Profile
      </a>
      <a mat-button routerLink="/ranking" routerLinkActive="nav-active">
        <mat-icon>leaderboard</mat-icon> Rankings
      </a>
    }

    @if (isManager()) {
      <a mat-button routerLink="/projects" routerLinkActive="nav-active">
        <mat-icon>folder</mat-icon> Projects
      </a>
      <a mat-button routerLink="/matching" routerLinkActive="nav-active">
        <mat-icon>auto_awesome</mat-icon> Matching
      </a>
      <a mat-button routerLink="/ranking" routerLinkActive="nav-active">
        <mat-icon>leaderboard</mat-icon> Rankings
      </a>
    }

    <button mat-button [matMenuTriggerFor]="userMenu" class="nav-user">
      <mat-icon>account_circle</mat-icon>
      <span class="nav-email">{{ userEmail() }}</span>
      <span class="role-chip">{{ isManager() ? 'Manager' : 'Employee' }}</span>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon> Sign out
      </button>
    </mat-menu>
  </nav>
}

<!-- Public top bar (visible only when NOT logged in and not verifying) -->
@if (!isVerifying() && !isLoggedIn()) {
  <header class="pub-header">
    <a routerLink="/" class="nav-brand">SRAS</a>
    <span class="nav-spacer"></span>
    <a mat-button routerLink="/login" class="pub-signin">Sign In</a>
    <a mat-flat-button routerLink="/signup" class="pub-cta">Get Started</a>
  </header>
}

<main class="main-content">
  <router-outlet />
</main>
