<div class="card-container">
  <mat-card class="form-card">
    <div class="card-top-bar">
      <h2>Sign In</h2>
      <p>Smart Resource Allocation System</p>
    </div>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="form-body">
        <mat-form-field class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email">
          @if (form.get('email')?.hasError('email')) {
            <mat-error>Enter a valid email</mat-error>
          }
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password">
          @if (form.get('password')?.hasError('required')) {
            <mat-error>Password is required</mat-error>
          }
        </mat-form-field>

        <button mat-raised-button color="primary" class="full-width mt-16"
                type="submit" [disabled]="form.invalid || loading">
          @if (loading) { <mat-spinner diameter="20"></mat-spinner> }
          @else { Sign In }
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <span>Don't have an account? <a routerLink="/signup">Sign up</a></span>
    </mat-card-actions>
  </mat-card>
</div>
