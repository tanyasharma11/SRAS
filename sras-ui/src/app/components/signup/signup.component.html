<div class="card-container">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>Create Account</mat-card-title>
      <mat-card-subtitle>Smart Resource Allocation System</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="form-body">
        <mat-form-field class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email">
          @if (form.get('email')?.hasError('email')) {
            <mat-error>Enter a valid email</mat-error>
          }
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password">
          @if (form.get('password')?.hasError('minlength')) {
            <mat-error>Minimum 6 characters</mat-error>
          }
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Role</mat-label>
          <mat-select formControlName="role">
            <mat-option value="EMPLOYEE">Employee</mat-option>
            <mat-option value="PROJECT_MANAGER">Project Manager</mat-option>
          </mat-select>
        </mat-form-field>

        <button mat-raised-button color="primary" class="full-width mt-16"
                type="submit" [disabled]="form.invalid || loading">
          @if (loading) { <mat-spinner diameter="20"></mat-spinner> }
          @else { Create Account }
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <span>Already have an account? <a routerLink="/login">Sign in</a></span>
    </mat-card-actions>
  </mat-card>
</div>
