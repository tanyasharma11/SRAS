# ─── DataSource ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/sras_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=sras-super-secret-key-minimum-256-bits-long-for-hs256-algorithm-ok
jwt.expiration=86400000

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8081

# ─── CORS ─────────────────────────────────────────────────────────────────────
# Configured programmatically in SecurityConfig; Angular runs on 4200
